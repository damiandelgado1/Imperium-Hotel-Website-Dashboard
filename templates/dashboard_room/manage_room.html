{% load static %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Imbue:opsz,wght@10..100,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">


<h3> HABITACIONES DISPONIBLES </h3>

{% block room %}

    <a href="{% url 'room:create_room' %}"> CREAR HABITACION </a>

    {% for room in rooms %}
        <article class="room">
            {% comment %} <img src=""> {% endcomment %}
            <h3> HABITACION NRO. {{ room.number }} </h3>
            <p> ESTADO DE DISPONIBILIDAD: {{ room.availability }} </p>
            <p> PRECIO: {{ room.price }} </p>
            <a href="{% url 'room:edit_room' room.pk %}" class="edit-room"> VER HABITACION </a>
        </article>
    {% endfor %}

{% endblock %}

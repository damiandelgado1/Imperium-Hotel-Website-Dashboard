{% load static %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Imbue:opsz,wght@10..100,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">


<!-- Show description of Item in Menu of the Restaurant -->
<article>
    <h3> {{ item.name }} </h3>
    <p> DESCRIPCION <br>
        {{ item.description }}
    </p>
    <p> DISPONIBILIDAD: {{ item.availability }} </p>
    <p> PRECIO: {{ item.price }} </p>

    <a href="{% url 'menu_item:modify_item' menu_item.pk %}"> MODIFICAR PLATO </a>
    <a href="{% url 'menu_item:delete_item' menu_item.pk %}"> ELIMINAR PLATO </a>
</article>

{% load static %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Imbue:opsz,wght@10..100,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">


<h3> ORDERNAR PLATO: {{ order.name }} </h3>

<form action="" method="POST">
    {% csrf_token %}

    <div>
        <label for="{{ form.name.id_for_label }}"> NOMBRE DE LA ORDEN </label> <br>
        {{ form.name }}
    </div>
    <br>

    <div>
        <label for="{{ form.amount.id_for_label }}"> INDIQUE LA CANTIDAD QUE QUIERE DE ESTE PLATO </label> <br>
        {{ form.amount }}
    </div>
    <br>

    <div>
        <label for="{{ form.payment.id_for_label }}"> INGRESE EL TOTAL A PAGAR </label> <br>
        {{ form.payment }}
    </div>
    <br>

    <button> ORDENAR PLATO </button>
</form>
